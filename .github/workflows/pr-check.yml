name: PR build check

# Validates a PR actually builds before it's allowed to auto-merge — see
# auto-merge.yml. Build-only, no push (PRs don't get package write
# access). Runs on every PR to main, not just Dockerfile/FLUTTER_VERSION
# changes: Dependabot's github-actions PRs touch workflow files, and if
# this check never ran for those, the "build-check" required status
# (branch protection) would never be satisfied and the PR would sit
# blocked forever instead of auto-merging.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A workflow-only change (e.g. Dependabot bumping actions/checkout's
      # version) can't affect the built image — skip the actual (slow)
      # Docker build for those, so the required check still passes
      # quickly instead of every unrelated PR paying full build cost.
      - name: Check whether the image itself is affected
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE '^(Dockerfile|FLUTTER_VERSION)$'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile/FLUTTER_VERSION change — skipping the image build."
          fi

      - if: steps.changed.outputs.affected == 'true'
        name: Read pinned Flutter version
        id: pinned
        run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changed.outputs.affected == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            FLUTTER_REF=${{ steps.pinned.outputs.version }}
