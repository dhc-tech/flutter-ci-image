name: Merge queue fallback for bot PRs

# GitHub's native merge queue (the proper fix for "several auto-merge PRs
# land, each one falls behind main as the previous one merges") requires
# an organization-owned repo on GitHub Team/Enterprise — rejected here
# with a generic validation error when actually attempted via the
# rulesets API, consistent with that being a plan/ownership restriction
# rather than a config mistake. This is the equivalent for a personal
# repo: periodically find open, trusted bot PRs and (1) enable auto-merge
# if it isn't already, since auto-merge.yml's pull_request_target trigger
# has been observed to simply not fire at all for some bot-opened PRs
# (confirmed on a real PR — zero runs of that workflow ever appeared for
# it, not even a blocked/action_required one) — this scheduled sweep is
# the reliable path, not a backup for a rare case; and (2) update the
# branch if it's fallen BEHIND main, so they don't sit stuck waiting for
# a manual "Update branch" click.
#
# Needs GH_PAT_WORKFLOW (repo secret: a personal access token with the
# `workflow` OAuth scope) — Dependabot's github-actions PRs modify files
# under .github/workflows/ themselves, and the default GITHUB_TOKEN can
# never update a PR branch that touches workflow files, full stop; no
# `permissions:` entry changes this (confirmed via a real failed run:
# "refusing to allow a GitHub App to ... update workflow ... without
# `workflows` permission"). A real user-owned PAT is the only way around
# it. Falls back to GITHUB_TOKEN if the secret isn't set (works for
# non-workflow-file PRs, e.g. the Flutter version bump bot's own PRs).
on:
  schedule:
    # Every 5 minutes — GitHub Actions' own documented minimum schedule
    # granularity.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  advance-trusted-prs:
    runs-on: ubuntu-latest
    steps:
      # Never merges anything itself — only enables auto-merge (GitHub's
      # own native feature then completes the merge once pr-check.yml's
      # build-check passes) and updates a stale branch. A failure here
      # just means that PR stays exactly where it was until the next
      # sweep — never silently hidden: any failure is logged and fails
      # this job, while still trying every other PR rather than one
      # failure blocking the rest.
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOW || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          prs="$(gh pr list --repo ${{ github.repository }} --state open --json number,author,labels,mergeStateStatus,url,autoMergeRequest)"
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number="$(echo "$pr" | jq -r '.number')"
            author="$(echo "$pr" | jq -r '.author.login')"
            url="$(echo "$pr" | jq -r '.url')"
            has_bump_label="$(echo "$pr" | jq -r '[.labels[].name] | contains(["automated-flutter-bump"])')"
            status="$(echo "$pr" | jq -r '.mergeStateStatus')"
            has_auto_merge="$(echo "$pr" | jq -r '.autoMergeRequest != null')"

            case "$author" in
              dependabot\[bot\]|app/dependabot) trusted=true ;;
              *) trusted="$has_bump_label" ;;
            esac

            if [ "$trusted" != "true" ]; then
              continue
            fi

            if [ "$has_auto_merge" != "true" ]; then
              echo "PR #$number ($author) has no auto-merge enabled yet — enabling."
              if ! gh pr merge --auto --squash "$url"; then
                echo "::error::Failed to enable auto-merge for PR #$number."
                echo "$number" >> /tmp/failed_prs
              fi
            fi

            if [ "$status" = "BEHIND" ]; then
              echo "PR #$number ($author) is behind main — updating branch."
              if ! gh api -X PUT "repos/${{ github.repository }}/pulls/$number/update-branch"; then
                echo "::error::Failed to update branch for PR #$number — it stays open/unmerged, not retried until the next scheduled sweep."
                echo "$number" >> /tmp/failed_prs
              fi
            fi
          done
          if [ -s /tmp/failed_prs ]; then
            echo "::error::advance-trusted-prs failed for: $(paste -sd, /tmp/failed_prs)"
            exit 1
          fi
