name: Merge queue fallback for bot PRs

# GitHub's native merge queue (the proper fix for "several auto-merge PRs
# land, each one falls behind main as the previous one merges") requires
# an organization-owned repo on GitHub Team/Enterprise — rejected here
# with a generic validation error when actually attempted via the
# rulesets API, consistent with that being a plan/ownership restriction
# rather than a config mistake. This is the equivalent for a personal
# repo: periodically find open, auto-merge-enabled bot PRs that have
# fallen behind main and update their branch, so they don't sit stuck
# waiting for a manual "Update branch" click.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stuck-branches:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          prs="$(gh pr list --state open --json number,author,labels,mergeStateStatus,url)"
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number="$(echo "$pr" | jq -r '.number')"
            author="$(echo "$pr" | jq -r '.author.login')"
            has_bump_label="$(echo "$pr" | jq -r '[.labels[].name] | contains(["automated-flutter-bump"])')"
            status="$(echo "$pr" | jq -r '.mergeStateStatus')"

            case "$author" in
              dependabot\[bot\]|app/dependabot) trusted=true ;;
              *) trusted="$has_bump_label" ;;
            esac

            if [ "$trusted" != "true" ]; then
              continue
            fi

            if [ "$status" = "BEHIND" ]; then
              echo "PR #$number ($author) is behind main — updating branch."
              gh api -X PUT "repos/${{ github.repository }}/pulls/$number/update-branch" || true
            fi
          done
