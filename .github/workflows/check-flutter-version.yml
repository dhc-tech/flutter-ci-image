name: Check for new Flutter stable release

on:
  schedule:
    # Every 5 minutes — GitHub Actions' own documented minimum schedule
    # granularity. A new stable release is really just flutter/flutter's
    # `stable` branch moving to a new tagged commit, so this polls often
    # and only acts when that actually happened (idempotent against an
    # already-open bump PR, below), which is as close to "the moment
    # Flutter tags a release" as a repo we don't own can get without a
    # real webhook.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest stable version directly from github.com/flutter/flutter
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # The `stable` channel *is* a branch in flutter/flutter — its
          # HEAD commit is whatever Flutter's release process most
          # recently promoted to stable. Match that commit against the
          # repo's own tags to get the real version number, straight from
          # the source (https://github.com/flutter/flutter), never a
          # hardcoded value or a third-party manifest.
          sha="$(gh api repos/flutter/flutter/commits/stable --jq '.sha')"
          version="$(gh api repos/flutter/flutter/tags --paginate --jq ".[] | select(.commit.sha == \"$sha\") | .name" | head -1)"
          if [ -z "$version" ]; then
            echo "No tag found on flutter/flutter's stable branch HEAD ($sha) — flutter/flutter's tagging convention may have changed." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare against pinned version
        id: compare
        run: |
          current="$(cat FLUTTER_VERSION)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.latest.outputs.version }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open version-bump PR
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.latest.outputs.version }}
          OLD_VERSION: ${{ steps.compare.outputs.current }}
        run: |
          branch="flutter-bump/${NEW_VERSION}"
          # Idempotent against a genuinely open bump PR — NOT against the
          # branch merely existing. A merged/closed PR's branch (normally
          # auto-deleted, but not guaranteed — e.g. delete-on-merge was
          # off when an earlier PR merged in this repo's own history) must
          # never block re-bumping to the same version number later, which
          # a plain "does the branch ref exist" check did in practice.
          open_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"
          if [ -n "$open_pr" ]; then
            echo "PR #$open_pr already open for $branch — skipping."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Stale branch $branch exists with no open PR — deleting it before recreating."
            git push origin --delete "$branch"
          fi
          git config user.name "flutter-version-bot"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          echo "$NEW_VERSION" > FLUTTER_VERSION
          git commit -am "chore: bump pinned Flutter to ${NEW_VERSION}"
          git push origin "$branch"
          gh pr create \
            --title "chore: bump pinned Flutter ${OLD_VERSION} → ${NEW_VERSION}" \
            --body "Automated: flutter/flutter's \`stable\` branch now points at **${NEW_VERSION}** (was ${OLD_VERSION}), detected directly from github.com/flutter/flutter — no hardcoded/external version source. Merging this rebuilds and pushes the \`pinned\`/\`${NEW_VERSION}\` image tags automatically — see build-and-push.yml. Auto-merges once CI passes (see auto-merge.yml)." \
            --label "automated-flutter-bump" \
            --base main \
            --head "$branch"
