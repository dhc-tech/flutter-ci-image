name: Auto-merge Flutter version bump PRs

# Restricted to PRs the bump bot itself opened (check-flutter-version.yml)
# — never auto-merges a human-authored PR, even if it happens to touch
# FLUTTER_VERSION. Actual merge only happens once pr-check.yml's build
# passes; GitHub's native auto-merge handles that wait.
on:
  pull_request:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      # Fetches the PR's current label list fresh via the API rather than
      # trusting github.event.pull_request.labels — when a PR is opened
      # with `gh pr create --label ...` in one call, the `opened` event's
      # webhook payload isn't reliably populated with that label yet (a
      # real timing quirk, confirmed by an actual bot-opened PR whose
      # `opened` event had an empty labels list despite --label having
      # been passed at creation).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          has_label="$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | contains(["automated-flutter-bump"])')"
          if [ "$has_label" != "true" ]; then
            echo "PR does not carry the automated-flutter-bump label — not auto-merging."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
