name: Build and push Android CI image

# Android-only — Docker containers can't build iOS at all (needs real
# macOS + Xcode). See README.md.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - FLUTTER_VERSION
  workflow_dispatch: {}
  schedule:
    # Weekly refresh for the rolling channel tags (stable/beta/main) so
    # they don't go stale — the pinned tag only rebuilds on an actual
    # FLUTTER_VERSION bump (via the push trigger above), never on this
    # schedule, so it stays reproducible.
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build-pinned:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Flutter version
        id: pinned
        run: echo "version=$(cat FLUTTER_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUTTER_REF=${{ steps.pinned.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flutter-android-ci:${{ steps.pinned.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/flutter-android-ci:pinned

  build-channels:
    strategy:
      fail-fast: false
      matrix:
        # The 3 real Flutter release channels — "dev" was deprecated, not
        # a current channel — https://docs.flutter.dev/release/upgrade.
        channel: [stable, beta, main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUTTER_REF=${{ matrix.channel }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flutter-android-ci:${{ matrix.channel }}
            ${{ matrix.channel == 'stable' && format('ghcr.io/{0}/flutter-android-ci:latest', github.repository_owner) || '' }}
